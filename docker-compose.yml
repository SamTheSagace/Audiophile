version: '3.8'

services:
  # Service Backend
  back:
    build: ./back
    container_name: projet-back
    ports:
      - "3000:3000"
    volumes:
      - ./back/src:/app/src
      - ./back/test:/app/test
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  # Service Frontend
  front:
    build: ./front
    container_name: projet-front
    ports:
      - "5173:5173"
    volumes:
      - ./front/public:/app/public
      - ./front/src:/app/src
    depends_on:
      - back
    env_file:
      - .env

  # PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: projet-db
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Adminer pour la gestion de la base de données
  adminer:
    image: adminer
    container_name: projet-adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
    env_file:
      - .env

volumes:
  postgres_data: